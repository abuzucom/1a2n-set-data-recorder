name: Convention Sync Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests-windows:
    # The gates run as the launcher named in .claude/settings.json, which
    # only this job can prove resolves on Windows. A hook that fails to
    # start exits non-zero but not 2, which Claude Code treats as a
    # non-blocking error, so every gate would fail open there in silence.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run tests
        run: python scripts/run_tests.py

  tests-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run tests
        run: python scripts/run_tests.py

  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.x'
      - name: Install checker dependencies
        run: python -m pip install --requirement requirements-checkers.txt
      - name: Run sync check
        run: python scripts/sync.py --check
      - name: Check the shared gate files against the manifest
        run: python scripts/sync.py --check-shared
      - name: Run style lint
        run: python scripts/lint_style.py
      - name: Check worktree conflict markers (ordinary test)
        run: python scripts/check_conflict_markers.py
      - name: Check no untested statement entered the hooks
        run: python scripts/check_hook_coverage.py
      - name: Check American spelling (warning only)
        run: python scripts/check_us_spelling.py AGENTS.md README.md CHANGELOG.md DRIFT.md docs/gate-threat-model.md docs/template-drift.md plan/HANDOFF.md.example SECURITY.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check English only (warning only)
        run: python scripts/check_english_only.py AGENTS.md README.md CHANGELOG.md DRIFT.md docs/gate-threat-model.md docs/template-drift.md plan/HANDOFF.md.example SECURITY.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check prose policy (warning only)
        run: python scripts/check_hedging.py AGENTS.md README.md CHANGELOG.md DRIFT.md docs/gate-threat-model.md docs/template-drift.md plan/HANDOFF.md.example SECURITY.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check pull request prose (warning only)
        if: github.event_name == 'pull_request'
        run: python scripts/check_pull_request_message.py
      - name: Check dashes and ASCII in template files
        run: python scripts/check_ascii.py plan/HANDOFF.md.example SECURITY.md.example CONTRIBUTING.md.example .github/PULL_REQUEST_TEMPLATE.md .github/ISSUE_TEMPLATE.md
      - name: Check dashes and ASCII in this repo's own prose
        run: python scripts/check_ascii.py README.md CHANGELOG.md DRIFT.md docs/gate-threat-model.md docs/template-drift.md
      - name: AgentLint (advisory)
        uses: 0xmariowu/AgentLint@6cf433c4092ee10a3162c2f4ddd68ff13b5d4aff
        with:
          fail-below: '0'
          format: md
          output-dir: agentlint-report
